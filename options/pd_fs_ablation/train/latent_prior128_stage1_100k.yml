name: pd_fs_stage1_x4_prior128_100k
model_type: DiffMSRS1Model
scale: 4
num_gpu: auto
manual_seed: 0
gt_size: 256
datasets:
  train:
    name: KneePD
    type: MCSRPairedDataset
    dataroot_gt: mri_data_complex/mc_knee_pd_fs/train
    dataroot_lq: mri_data_complex/mc_knee_pd_fs/train
    dataroot_mask: mri_data_complex/mc_knee_pd_fs/dc_mask.mat
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 256
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 1
    dataset_enlarge_ratio: 1
    prefetch_mode: null
  val_1:
    name: KneePD
    type: MCSRPairedDataset
    dataroot_gt: mri_data_complex/mc_knee_pd_fs/valid
    dataroot_lq: mri_data_complex/mc_knee_pd_fs/valid
    dataroot_mask: mri_data_complex/mc_knee_pd_fs/dc_mask.mat
    filename_tmpl: '{}'
    io_backend:
      type: disk
network_g:
  type: DiffMSR_S1
  n_encoder_res: 9
  inp_channels: 2
  out_channels: 2
  dim: 32
  num_blocks:
  - 6
  - 6
  - 6
  - 6
  num_refinement_blocks: 6
  heads:
  - 4
  - 4
  - 4
  - 4
  ffn_expansion_factor: 2.2
  bias: false
  LayerNorm_type: BiasFree
  prior_dim: 128
path:
  pretrain_network_g: null
  param_key_g: params_ema
  strict_load_g: true
  resume_state: null
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: 1.0e-05
    weight_decay: 0
    betas:
    - 0.9
    - 0.99
  scheduler:
    type: MultiStepLR
    milestones:
    - 250000
    - 400000
    - 450000
    - 475000
    gamma: 0.5
  total_iter: 100000
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
val:
  window_size: 8
  skip_initial: true
  val_freq: 999999.0
  save_img: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: true
logger:
  print_freq: 100
  save_checkpoint_freq: 50000.0
  use_tb_logger: true
  wandb:
    project: null
    resume_id: null
dist_params:
  backend: nccl
  port: 29500
