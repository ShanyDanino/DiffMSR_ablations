# Held-out PD / PD fat-sat test for the completed image-space Stage-2 model.
name: Image_Space_DiffMSR_test
model_type: DiffMSRS2Model
scale: 4
num_gpu: auto
manual_seed: 0

datasets:
  test_1:
    name: KneePDExample
    type: MCSRPairedDataset
    dataroot_gt: mri_data_complex/mc_knee_pd_fs/valid
    dataroot_lq: mri_data_complex/mc_knee_pd_fs/valid
    dataroot_mask: mri_data_complex/mc_knee_pd_fs/dc_mask.mat
    domain_mode: image_space
    filename_tmpl: '{}'
    io_backend:
      type: disk

network_g:
  type: DiffMSR_S2
  n_encoder_res: 9
  inp_channels: 2
  out_channels: 2
  dim: 32
  num_blocks: [6,6,6,6]
  num_refinement_blocks: 6
  heads: [4,4,4,4]
  ffn_expansion_factor: 2.2
  bias: false
  LayerNorm_type: BiasFree
  n_denoise_res: 1
  linear_start: 0.1
  linear_end: 0.99
  timesteps: 4
  sample_timesteps: 4
  sample_timestep_mode: uniform

network_S1:
  type: DiffMSR_S1
  n_encoder_res: 9
  inp_channels: 2
  out_channels: 2
  dim: 32
  num_blocks: [6,6,6,6]
  num_refinement_blocks: 6
  heads: [4,4,4,4]
  ffn_expansion_factor: 2.2
  bias: false
  LayerNorm_type: BiasFree

path:
  pretrain_network_S1: experiments/Image_Space_DiffMSR_train_S1/models/net_g_latest.pth
  pretrain_network_g: experiments/Image_Space_DiffMSR_train_S2/models/net_g_latest.pth
  param_key_g: params_ema
  strict_load_g: false
  ignore_resume_networks: network_S1

train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [250000,400000,450000,475000]
    gamma: 0.5
  total_iter: 500
  warmup_iter: -1
  encoder_iter: 0
  lr_encoder: !!float 2e-4
  lr_sr: !!float 2e-4
  gamma_encoder: 0.1
  gamma_sr: 0.5
  lr_decay_encoder: 30000
  lr_decay_sr: 300000
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  kd_opt:
    type: KDLoss
    loss_weight: 1
    temperature: 0.15

val:
  window_size: 8
  save_img: true
  suffix: ~
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: true

dist_params:
  backend: nccl
  port: 29500
