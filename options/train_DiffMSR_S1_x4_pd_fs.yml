# general settings
name: pd_fs_stage1_x4
model_type: DiffMSRS1Model
scale: 4
num_gpu: auto
manual_seed: 0

gt_size: 256

# dataset and data loader settings
datasets:
  train:
    name: KneePD
    type: MCSRPairedDataset
    dataroot_gt: mri_data_complex/mc_knee_pd_fs/train
    dataroot_lq: mri_data_complex/mc_knee_pd_fs/train
    dataroot_mask: mri_data_complex/mc_knee_pd_fs/dc_mask.mat
    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 256
    use_hflip: true
    use_rot: true

    num_worker_per_gpu: 4
    batch_size_per_gpu: 1
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val_1:
    name: KneePD
    type: MCSRPairedDataset
    dataroot_gt: mri_data_complex/mc_knee_pd_fs/valid
    dataroot_lq: mri_data_complex/mc_knee_pd_fs/valid
    dataroot_mask: mri_data_complex/mc_knee_pd_fs/dc_mask.mat
    filename_tmpl: '{}'
    io_backend:
      type: disk

# network structures
network_g:
  type: DiffMSR_S1
  n_encoder_res: 9
  inp_channels: 2
  out_channels: 2
  dim: 32
  num_blocks: [6,6,6,6]
  num_refinement_blocks: 6
  heads: [4,4,4,4]
  ffn_expansion_factor: 2.2
  bias: False
  LayerNorm_type: BiasFree

# path
path:
  pretrain_network_g: ~
  param_key_g: params_ema
  strict_load_g: true
  resume_state: ~

# training settings
train:
  ema_decay: 0.999

  optim_g:
    type: Adam
    lr: !!float 1e-5
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [250000,400000,450000,475000]
    gamma: 0.5

  total_iter: 500000
  warmup_iter: -1

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  window_size: 8
  skip_initial: true
  val_freq: !!float 1e4
  save_img: false

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: true

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
